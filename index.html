<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Financial Control & Cash Monitoring</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .login-card { max-width: 400px; width: 100%; border-radius: 12px; border: none; }
    .brand-icon { width: 60px; height: 60px; background: rgba(13, 110, 253, 0.1); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
    .ptr-indicator { position: fixed; top: -60px; left: 50%; transform: translateX(-50%); background: #0d6efd; color: white; padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: top 0.3s ease; z-index: 9999; }
    .footer-text { font-size: 0.78rem; color: #6c757d; }
    .balance-card { border-left: 4px solid #0d6efd; transition: transform 0.2s; }
    .balance-card:hover { transform: translateY(-3px); }
    
    .btn-toggle-mutasi { text-decoration: none; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .mutation-category-item { cursor: pointer; padding: 6px 10px; border-radius: 6px; transition: background 0.2s; }
    .mutation-category-item:hover { background-color: #eef2f7; }
    .table-detail { font-size: 0.78rem; }
  </style>
</head>
<body>

  <div id="ptr-indicator" class="ptr-indicator">
    <i class="fas fa-sync-alt fa-spin me-2"></i> Memperbarui data...
  </div>

  <!-- LOGIN SECTION -->
  <div id="login-section" class="container-fluid d-flex flex-column align-items-center justify-content-center min-vh-100 bg-light py-4">
    <div class="card login-card p-4 shadow-lg mb-3">
      <div class="text-center mb-4">
        <div class="brand-icon mb-2">
          <i class="fas fa-chart-line fa-2x text-primary"></i>
        </div>
        <h4 class="fw-bold text-dark">Financial Control</h4>
        <p class="text-muted small">Cash Monitoring & Bank Statements</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label text-secondary small">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-secondary small">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
          </div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="savePassword">
          <label class="form-check-label text-secondary small" for="savePassword">Simpan Password</label>
        </div>

        <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2">
          <span id="btnText">Masuk (Login)</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>
      <div id="loginAlert" class="alert alert-danger mt-3 d-none small" role="alert"></div>
    </div>

    <div class="text-center footer-text">
      @2026 Millennium Holdings System
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-section" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#"><i class="fas fa-wallet me-2"></i>Financial Control</a>
        <button class="btn btn-outline-light btn-sm ms-auto" onclick="handleLogout()">
          <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
      </div>
    </nav>

    <div class="container my-4">
      <!-- USER INFO -->
      <div class="card bg-white shadow-sm mb-4 border-0">
        <div class="card-body d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div>
            <h5 class="fw-bold mb-1" id="user-display-name">User</h5>
            <span class="badge bg-primary" id="user-display-role">ROLE</span>
          </div>
          <div class="text-end">
            <span class="text-muted small d-block">Akses Perusahaan:</span>
            <strong id="user-display-companies" class="text-dark"></strong>
          </div>
        </div>
      </div>

      <!-- COMPANY MONITORING CONTAINER -->
      <div id="companies-container"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHF5n8LG9_clLnu3wA4xeDQMQ0k3LZHm6i-qhUNdhp5OhFmYKdBDD1atJve-CPkIaL/exec";
    
    let mutationsCache = {};

    document.addEventListener("DOMContentLoaded", function() {
      checkActiveSession();
      document.getElementById("username").addEventListener("input", handleUsernameChange);
      initPullToRefresh();
    });

    function checkActiveSession() {
      const savedSession = sessionStorage.getItem("fc_active_session");
      if (savedSession) {
        try {
          const sessionData = JSON.parse(savedSession);
          renderDashboard(sessionData.user, sessionData.companies);
        } catch (e) {
          sessionStorage.removeItem("fc_active_session");
          loadSavedPassword();
        }
      } else {
        loadSavedPassword();
      }
    }

    function handleUsernameChange() {
      const currentInputUser = document.getElementById("username").value.trim().toLowerCase();
      const savedUser = (localStorage.getItem("fc_saved_user") || "").toLowerCase();
      const isSaveActive = localStorage.getItem("fc_save_flag") === "true";

      if (isSaveActive && currentInputUser === savedUser && currentInputUser !== "") {
        document.getElementById("password").value = localStorage.getItem("fc_saved_pass") || "";
        document.getElementById("savePassword").checked = true;
      } else {
        document.getElementById("password").value = "";
        document.getElementById("savePassword").checked = false;
      }
    }

    function loadSavedPassword() {
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      document.getElementById("savePassword").checked = false;
    }

    function handleLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById("username").value.trim();
      const passVal = document.getElementById("password").value;
      const savePass = document.getElementById("savePassword").checked;

      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");
      const alertBox = document.getElementById("loginAlert");

      btnText.textContent = "Memproses...";
      btnSpinner.classList.remove("d-none");
      alertBox.classList.add("d-none");

      if (savePass) {
        localStorage.setItem("fc_saved_user", userVal);
        localStorage.setItem("fc_saved_pass", passVal);
        localStorage.setItem("fc_save_flag", "true");
      } else {
        localStorage.removeItem("fc_saved_user");
        localStorage.removeItem("fc_saved_pass");
        localStorage.removeItem("fc_save_flag");
      }

      fetch(`${APPS_SCRIPT_URL}?action=login&username=${encodeURIComponent(userVal)}&password=${encodeURIComponent(passVal)}`)
        .then(response => response.json())
        .then(data => {
          btnText.textContent = "Masuk (Login)";
          btnSpinner.classList.add("d-none");

          if (data.success) {
            sessionStorage.setItem("fc_active_session", JSON.stringify(data));
            renderDashboard(data.user, data.companies);
          } else {
            alertBox.textContent = data.message;
            alertBox.classList.remove("d-none");
          }
        })
        .catch(err => {
          btnText.textContent = "Masuk (Login)";
          btnSpinner.classList.add("d-none");
          alertBox.textContent = "Gagal terhubung ke server Backend!";
          alertBox.classList.remove("d-none");
        });
    }

    function handleLogout() {
      sessionStorage.removeItem("fc_active_session");
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      document.getElementById("savePassword").checked = false;
      document.getElementById("loginAlert").classList.add("d-none");
      document.getElementById("dashboard-section").classList.add("d-none");
      document.getElementById("login-section").classList.remove("d-none");
    }

    function formatIDR(amount, ccy) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: ccy || 'IDR', maximumFractionDigits: 0 }).format(amount);
    }

    function renderDashboard(user, companies) {
      document.getElementById("login-section").classList.add("d-none");
      document.getElementById("dashboard-section").classList.remove("d-none");

      document.getElementById("user-display-name").textContent = user.name;
      document.getElementById("user-display-role").textContent = user.role.toUpperCase();
      
      const compNames = companies.map(c => c.companyName).join(", ");
      document.getElementById("user-display-companies").textContent = compNames || "Tidak Ada Access";

      const container = document.getElementById("companies-container");
      container.innerHTML = "";

      let grandTotalIDR = 0;
      let companyTotals = {};

      companies.forEach(company => {
        let compTotal = 0;
        if (company.accounts && company.accounts.length > 0) {
          company.accounts.forEach(acc => {
            if ((acc.currency || 'IDR').toUpperCase() === 'IDR') {
              compTotal += Number(acc.lastBalance || 0);
            }
          });
        }
        companyTotals[company.companyName] = compTotal;
        grandTotalIDR += compTotal;
      });

      if (user.role === "admin") {
        const grandTotalCard = `
          <div class="card bg-primary text-white shadow-sm border-0 mb-4">
            <div class="card-body p-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
              <div>
                <span class="text-white-50 text-uppercase fw-bold small"><i class="fas fa-coins me-2"></i>TOTAL KESELURUHAN SALDO IDR (ALL COMPANIES)</span>
                <h2 class="fw-bold mb-0 mt-1">${formatIDR(grandTotalIDR, 'IDR')}</h2>
              </div>
              <div class="text-end">
                <span class="badge bg-white text-primary fw-bold px-3 py-2 rounded-pill">${companies.length} Entitas Perusahaan</span>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += grandTotalCard;
      }

      companies.forEach((company, compIndex) => {
        const compTotalIDR = companyTotals[company.companyName] || 0;
        
        let accountsHTML = "";
        if (company.accounts && company.accounts.length > 0) {
          company.accounts.forEach((acc, accIndex) => {
            const accId = `acc-${compIndex}-${accIndex}`;
            
            accountsHTML += `
              <div class="col-md-6 col-lg-4 mb-3">
                <div class="card balance-card h-100 shadow-sm p-3">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-bold text-primary"><i class="fas fa-university me-1"></i> ${acc.accountName}</span>
                    <span class="badge bg-light text-dark border">${acc.currency}</span>
                  </div>
                  <h4 class="fw-bold ${acc.lastBalance < 0 ? 'text-danger' : 'text-dark'} my-1">
                    ${formatIDR(acc.lastBalance, acc.currency)}
                  </h4>
                  <div class="d-flex justify-content-between text-muted small mt-2 border-bottom pb-2">
                    <span><i class="fas fa-list me-1"></i> ${acc.totalRows} Transaksi</span>
                    <span><i class="fas fa-calendar-alt me-1"></i> ${acc.lastDataDate}</span>
                  </div>

                  <!-- ACCORDION MUTASI TOGGLE -->
                  <div class="mt-2 text-end">
                    <a class="btn-toggle-mutasi text-primary" data-bs-toggle="collapse" href="#collapse-${accId}" 
                       onclick="loadMutations('${company.spreadsheetId}', '${acc.accountName}', '${accId}')">
                      <i class="fas fa-chevron-down me-1"></i> Detail Mutasi Bulanan
                    </a>
                  </div>

                  <!-- ACCORDION CONTENT (LEVEL 2 & 3) -->
                  <div class="collapse mt-3" id="collapse-${accId}">
                    <div id="mutation-body-${accId}" class="p-2 bg-light rounded border">
                      <div class="text-center text-muted small py-2">
                        <i class="fas fa-spinner fa-spin me-1"></i> Memuat mutasi...
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            `;
          });
        } else {
          accountsHTML = `<div class="col-12"><div class="alert alert-warning small">Data 'BalanceExport' tidak ditemukan atau kosong.</div></div>`;
        }

        let linksHTML = "";
        if (company.bankLinks && company.bankLinks.length > 0) {
          company.bankLinks.forEach(b => {
            if (b.sheetUrl) {
              linksHTML += `<a href="${b.sheetUrl}" target="_blank" class="btn btn-outline-secondary btn-sm me-2 mb-2"><i class="fas fa-external-link-alt me-1"></i> Combine ${b.bankName}</a>`;
            }
          });
        }

        const companyCard = `
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
              <h5 class="fw-bold mb-0 text-dark"><i class="fas fa-building text-primary me-2"></i> ${company.companyName}</h5>
              <div class="text-end">
                <span class="text-muted small me-2">Total Saldo IDR:</span>
                <span class="fw-bold text-success fs-5">${formatIDR(compTotalIDR, 'IDR')}</span>
              </div>
            </div>
            <div class="card-body">
              <h6 class="text-secondary small fw-bold mb-3">RINGKASAN REKENING BANK (BALANCE EXPORT)</h6>
              <div class="row">
                ${accountsHTML}
              </div>
              ${linksHTML ? `<div class="mt-2 pt-2 border-top"><h6 class="text-secondary small fw-bold mb-2">AKSES SHEET MUTASI TRANSMISI:</h6>${linksHTML}</div>` : ''}
            </div>
          </div>
        `;
        container.innerHTML += companyCard;
      });
    }

    function loadMutations(spreadsheetId, accountName, accId) {
      const container = document.getElementById(`mutation-body-${accId}`);
      const cacheKey = `${spreadsheetId}_${accountName}`;

      if (mutationsCache[cacheKey]) {
        renderMutationDetails(container, mutationsCache[cacheKey], accId);
        return;
      }

      fetch(`${APPS_SCRIPT_URL}?action=getMutations&spreadsheetId=${encodeURIComponent(spreadsheetId)}&accountName=${encodeURIComponent(accountName)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            mutationsCache[cacheKey] = data.monthlyData;
            renderMutationDetails(container, data.monthlyData, accId);
          } else {
            container.innerHTML = `<div class="alert alert-danger p-2 small mb-0">${data.message}</div>`;
          }
        })
        .catch(err => {
          container.innerHTML = `<div class="alert alert-danger p-2 small mb-0">Gagal mengambil data mutasi.</div>`;
        });
    }

    function renderMutationDetails(container, monthlyData, accId) {
      const months = Object.keys(monthlyData).sort().reverse();

      if (months.length === 0) {
        container.innerHTML = `<div class="text-muted small text-center py-2">Tidak ada riwayat mutasi.</div>`;
        return;
      }

      let html = `<div class="accordion accordion-flush" id="acc-month-${accId}">`;

      months.forEach((mKey, idx) => {
        const mData = monthlyData[mKey];
        const monthHeaderId = `mHead-${accId}-${idx}`;
        const monthCollapseId = `mCol-${accId}-${idx}`;

        const [year, month] = mKey.split("-");
        const monthName = new Date(year, month - 1, 1).toLocaleString('id-ID', { month: 'long', year: 'numeric' });

        html += `
          <div class="accordion-item bg-transparent">
            <h2 class="accordion-header" id="${monthHeaderId}">
              <button class="accordion-button collapsed py-2 px-2 small bg-white rounded my-1 shadow-sm" type="button" data-bs-toggle="collapse" data-bs-target="#${monthCollapseId}">
                <div class="w-100 d-flex justify-content-between align-items-center me-2">
                  <span class="fw-bold text-dark">${monthName}</span>
                  <div class="small">
                    <span class="badge bg-success-subtle text-success me-1">+${formatIDR(mData.totalCashIn)}</span>
                    <span class="badge bg-danger-subtle text-danger">-${formatIDR(mData.totalCashOut)}</span>
                  </div>
                </div>
              </button>
            </h2>
            <div id="${monthCollapseId}" class="accordion-collapse collapse" data-bs-parent="#acc-month-${accId}">
              <div class="accordion-body p-2 bg-white rounded mb-2 border">
                
                <!-- CASH IN SUB-GROUPS -->
                <div class="mb-2">
                  <span class="fw-bold text-success small"><i class="fas fa-arrow-down me-1"></i> Cash In (Masuk)</span>
                  <div class="mutation-category-item d-flex justify-content-between small" data-bs-toggle="collapse" href="#items-setor-${accId}-${idx}">
                    <span><i class="fas fa-caret-right me-1"></i> Setoran Tunai</span>
                    <span class="fw-bold">${formatIDR(mData.setoranTunai.total)}</span>
                  </div>
                  <div class="collapse ms-3 mt-1" id="items-setor-${accId}-${idx}">
                    ${renderTableItems(mData.setoranTunai.items)}
                  </div>

                  <div class="mutation-category-item d-flex justify-content-between small" data-bs-toggle="collapse" href="#items-trf-in-${accId}-${idx}">
                    <span><i class="fas fa-caret-right me-1"></i> Transfer Masuk (Lainnya)</span>
                    <span class="fw-bold">${formatIDR(mData.transferMasuk.total)}</span>
                  </div>
                  <div class="collapse ms-3 mt-1" id="items-trf-in-${accId}-${idx}">
                    ${renderTableItems(mData.transferMasuk.items)}
                  </div>
                </div>

                <!-- CASH OUT SUB-GROUPS -->
                <div>
                  <span class="fw-bold text-danger small"><i class="fas fa-arrow-up me-1"></i> Cash Out (Keluar)</span>
                  <div class="mutation-category-item d-flex justify-content-between small" data-bs-toggle="collapse" href="#items-tarik-${accId}-${idx}">
                    <span><i class="fas fa-caret-right me-1"></i> Tarikan Tunai</span>
                    <span class="fw-bold">${formatIDR(mData.tarikanTunai.total)}</span>
                  </div>
                  <div class="collapse ms-3 mt-1" id="items-tarik-${accId}-${idx}">
                    ${renderTableItems(mData.tarikanTunai.items)}
                  </div>

                  <div class="mutation-category-item d-flex justify-content-between small" data-bs-toggle="collapse" href="#items-trf-out-${accId}-${idx}">
                    <span><i class="fas fa-caret-right me-1"></i> Transfer Keluar (Lainnya)</span>
                    <span class="fw-bold">${formatIDR(mData.transferKeluar.total)}</span>
                  </div>
                  <div class="collapse ms-3 mt-1" id="items-trf-out-${accId}-${idx}">
                    ${renderTableItems(mData.transferKeluar.items)}
                  </div>
                </div>

              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderTableItems(items) {
      if (!items || items.length === 0) {
        return `<div class="text-muted small py-1 fst-italic">Tidak ada transaksi.</div>`;
      }

      let rows = items.map(item => `
        <tr>
          <td>${item.date}</td>
          <td class="text-truncate" style="max-width: 140px;" title="${item.desc}">${item.desc || '-'}</td>
          <td class="text-end fw-semibold">${formatIDR(item.amount)}</td>
        </tr>
      `).join("");

      return `
        <table class="table table-sm table-striped table-bordered table-detail mb-1">
          <thead class="table-light">
            <tr>
              <th>Tgl</th>
              <th>Ket</th>
              <th class="text-end">Nominal</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    function initPullToRefresh() {
      let touchStartPosY = 0;
      const ptrIndicator = document.getElementById("ptr-indicator");

      window.addEventListener('touchstart', e => { touchStartPosY = e.touches[0].pageY; }, { passive: true });
      window.addEventListener('touchmove', e => {
        const touchMovePosY = e.touches[0].pageY;
        if (window.scrollY === 0 && touchMovePosY - touchStartPosY > 120) {
          ptrIndicator.style.top = '10px';
        }
      }, { passive: true });

      window.addEventListener('touchend', e => {
        if (ptrIndicator.style.top === '10px') {
          setTimeout(() => { ptrIndicator.style.top = '-60px'; location.reload(); }, 800);
        }
      }, { passive: true });
    }
  </script>
</body>
</html>
